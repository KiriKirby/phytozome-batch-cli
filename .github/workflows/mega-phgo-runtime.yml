name: Build mega-phgo-runtime

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mega-phgo-runtime.yml"
      - "_mega_source/MEGA12.1-source/PHgoRuntime/**"
      - "assets/mega-phgo-runtime/**"
      - "scripts/build-mega-phgo-runtime.ps1"
      - "scripts/package-mega-phgo-runtime.ps1"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-latest
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: macos-amd64
            runner: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Lazarus/FPC on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install lazarus -y --no-progress

      - name: Install Lazarus/FPC on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fpc lazarus
          chmod +x assets/mega-phgo-runtime/linux-amd64/runtime/muscleUnix64.exe

      - name: Install Lazarus/FPC on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install fpc
          brew install --cask lazarus
          chmod +x assets/mega-phgo-runtime/macos-amd64/runtime/muscledarwin64

      - name: Build runtime
        shell: pwsh
        run: |
          $lazBuildPath = ""
          if ("${{ runner.os }}" -eq "macOS") {
            $candidate = Get-ChildItem -LiteralPath "/Applications" -Recurse -File -Filter lazbuild -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) {
              $lazBuildPath = $candidate.FullName
            }
          }
          if ([string]::IsNullOrWhiteSpace($lazBuildPath)) {
            & ./scripts/build-mega-phgo-runtime.ps1 -Platform "${{ matrix.platform }}"
          } else {
            & ./scripts/build-mega-phgo-runtime.ps1 -Platform "${{ matrix.platform }}" -LazBuildPath $lazBuildPath
          }

      - name: Package runtime
        shell: pwsh
        run: |
          . ./scripts/mega-phgo-runtime-release.ps1
          ./scripts/package-mega-phgo-runtime.ps1 -Platform "${{ matrix.platform }}"
          $assetName = Get-MegaPHGORuntimeAssetName -Platform "${{ matrix.platform }}" -RepoRoot (Get-Location)
          "RUNTIME_ASSET=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RUNTIME_ASSET }}
          path: bin/${{ env.RUNTIME_ASSET }}
          if-no-files-found: error
